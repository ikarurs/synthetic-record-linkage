  <g id="text_20">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203343" x="47.52" y="49.076719" transform="rotate(-0 47.52 49.076719)">How pending reviews change the comparison</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586875" x="47.52" y="74.598281" transform="rotate(-0 47.52 74.598281)">Year 3 · six fictional towns · the outcome stays fixed while the linkage assumption changes</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203343" x="47.52" y="572.976" transform="rotate(-0 47.52 572.976)">Each connector joins two assumptions for the same town. It is not a confidence interval.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586875" transform="translate(47.52 604.344)">Both shares use 12 earlier people per town. The scenario is not an upper bound on true continuity: missed records can remain.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #586875" transform="translate(47.52 619.344)">Six invented observations describe plotting and sensitivity methods; they support no effect estimate or causal conclusion.</text>
  </g>
